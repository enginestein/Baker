[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baker-python"
version = "3.0.0"
description = "Bot-Maker Baker - A smart yet simple chatbot framework for Python"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "sentence-transformers>=2.2",
    "numpy>=1.21"
]
keywords = ["chatbot", "nlp", "bot", "conversational-ai", "chat-bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/enginestein/Baker"
Repository = "https://github.com/enginestein/Baker"
